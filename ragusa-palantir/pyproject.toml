[project]
name = "ragusa-palantir"
version = "0.1.0"
description = "Historical research database for the Republic of Ragusa"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["networkx", "matplotlib"]
dev = ["pytest", "ruff"]
pdf = ["pdfplumber"]

[project.scripts]
ragusa = "ragusa.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
